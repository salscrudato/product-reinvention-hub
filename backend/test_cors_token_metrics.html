<!DOCTYPE html>
<html>
<head>
    <title>Test Token Metrics CORS</title>
</head>
<body>
    <h1>Token Metrics CORS Test</h1>
    <button onclick="testCORS()">Test Token Metrics Endpoint</button>
    <div id="result"></div>

    <script>
        async function testCORS() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p>Testing...</p>';
            
            try {
                const response = await fetch('http://127.0.0.1:5000/token_metrics?username=snow_admin', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include'
                });
                
                const data = await response.json();
                resultDiv.innerHTML = `
                    <h3>✅ SUCCESS!</h3>
                    <p><strong>Status:</strong> ${response.status}</p>
                    <p><strong>Enabled:</strong> ${data.enabled}</p>
                    <p><strong>Entries:</strong> ${data.entries ? data.entries.length : 0}</p>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3>❌ ERROR</h3>
                    <p>${error.message}</p>
                    <p>Check browser console for details</p>
                `;
                console.error('CORS Error:', error);
            }
        }
    </script>
</body>
</html>
