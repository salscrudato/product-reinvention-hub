<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swagger Upload Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .upload-section {
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }
        
        .upload-section.drag-over {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .file-input-label {
            display: inline-block;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.3s ease;
        }
        
        .file-input-label:hover {
            background: #5568d3;
        }
        
        #fileInput {
            display: none;
        }
        
        .file-info {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            display: none;
        }
        
        .file-info.visible {
            display: block;
        }
        
        .file-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .file-size {
            color: #666;
            font-size: 14px;
        }
        
        .upload-btn {
            width: 100%;
            padding: 15px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 20px;
        }
        
        .upload-btn:hover:not(:disabled) {
            background: #059669;
        }
        
        .upload-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .results {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        
        .results.visible {
            display: block;
        }
        
        .results.success {
            background: #d1fae5;
            border: 1px solid #10b981;
        }
        
        .results.error {
            background: #fee2e2;
            border: 1px solid #ef4444;
        }
        
        .results-title {
            font-weight: 600;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .results.success .results-title {
            color: #065f46;
        }
        
        .results.error .results-title {
            color: #991b1b;
        }
        
        .result-item {
            margin: 10px 0;
            padding: 10px;
            background: white;
            border-radius: 4px;
        }
        
        .result-label {
            font-weight: 600;
            color: #555;
            margin-right: 8px;
        }
        
        .operation-list {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 15px;
        }
        
        .operation-item {
            padding: 12px;
            background: white;
            border-radius: 4px;
            margin-bottom: 8px;
            border-left: 4px solid #667eea;
        }
        
        .operation-header {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .operation-detail {
            font-size: 13px;
            color: #666;
            margin: 3px 0;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .api-config {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .api-config label {
            font-weight: 600;
            margin-right: 10px;
        }
        
        .api-config input {
            padding: 5px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 300px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Swagger/OpenAPI File Upload Test</h1>
        <p class="subtitle">Upload your Swagger YAML or JSON file to test the mapping API</p>
        
        <div class="api-config">
            <label for="apiUrl">API Endpoint:</label>
            <input type="text" id="apiUrl" value="http://localhost:5001/mapping/parse/swagger">
        </div>
        
        <div class="upload-section" id="dropZone">
            <p style="color: #666; margin-bottom: 15px;">📄 Drag & drop your file here or</p>
            <label for="fileInput" class="file-input-label">Choose File</label>
            <input type="file" id="fileInput" accept=".json,.yaml,.yml">
            <p style="margin-top: 15px; font-size: 13px; color: #999;">
                Accepted formats: .json, .yaml, .yml
            </p>
        </div>
        
        <div class="file-info" id="fileInfo">
            <div class="file-name" id="fileName"></div>
            <div class="file-size" id="fileSize"></div>
        </div>
        
        <button class="upload-btn" id="uploadBtn" disabled>
            Upload & Parse
        </button>
        
        <div class="results" id="results">
            <div class="results-title" id="resultsTitle"></div>
            <div id="resultsContent"></div>
        </div>
    </div>
    
    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const fileInfo = document.getElementById('fileInfo');
        const fileName = document.getElementById('fileName');
        const fileSize = document.getElementById('fileSize');
        const uploadBtn = document.getElementById('uploadBtn');
        const results = document.getElementById('results');
        const resultsTitle = document.getElementById('resultsTitle');
        const resultsContent = document.getElementById('resultsContent');
        const apiUrlInput = document.getElementById('apiUrl');
        
        let selectedFile = null;
        
        // File input change handler
        fileInput.addEventListener('change', (e) => {
            handleFile(e.target.files[0]);
        });
        
        // Drag & drop handlers
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });
        
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            handleFile(e.dataTransfer.files[0]);
        });
        
        // Handle file selection
        function handleFile(file) {
            if (!file) return;
            
            // Validate file type
            const validExtensions = ['.json', '.yaml', '.yml'];
            const fileExt = '.' + file.name.split('.').pop().toLowerCase();
            
            if (!validExtensions.includes(fileExt)) {
                showResults('error', 'Invalid file type. Please select a .json, .yaml, or .yml file.');
                return;
            }
            
            selectedFile = file;
            fileName.textContent = `📄 ${file.name}`;
            fileSize.textContent = `Size: ${formatFileSize(file.size)}`;
            fileInfo.classList.add('visible');
            uploadBtn.disabled = false;
            results.classList.remove('visible');
        }
        
        // Format file size
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }
        
        // Upload file
        uploadBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            
            uploadBtn.disabled = true;
            uploadBtn.innerHTML = '<span class="spinner"></span> Uploading...';
            results.classList.remove('visible');
            
            const formData = new FormData();
            formData.append('file', selectedFile);
            
            try {
                const apiUrl = apiUrlInput.value;
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok && data.status === 'success') {
                    showSuccessResults(data);
                } else {
                    showResults('error', data.message || 'Upload failed');
                }
                
            } catch (error) {
                showResults('error', `Connection error: ${error.message}. Make sure the backend is running on port 5001.`);
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.textContent = 'Upload & Parse';
            }
        });
        
        // Show error/success message
        function showResults(type, message) {
            results.className = `results visible ${type}`;
            resultsTitle.textContent = type === 'success' ? '✅ Success!' : '❌ Error';
            resultsContent.innerHTML = `<div class="result-item">${message}</div>`;
        }
        
        // Show detailed success results
        function showSuccessResults(data) {
            const summary = data.summary;
            const operations = data.operations || [];
            
            let html = `
                <div class="result-item">
                    <span class="result-label">API Title:</span> ${summary.api_title}
                </div>
                <div class="result-item">
                    <span class="result-label">Version:</span> ${summary.api_version}
                </div>
                <div class="result-item">
                    <span class="result-label">Total Operations:</span> ${summary.total_operations}
                </div>
                <div class="result-item">
                    <span class="result-label">Total Attributes:</span> ${data.context.total_attributes}
                </div>
            `;
            
            if (operations.length > 0) {
                html += `
                    <div style="margin-top: 20px;">
                        <strong>📋 Operations Extracted:</strong>
                        <div class="operation-list">
                `;
                
                operations.forEach((op, index) => {
                    html += `
                        <div class="operation-item">
                            <div class="operation-header">
                                ${index + 1}. ${op.operation_id}
                            </div>
                            <div class="operation-detail">
                                <strong>${op.method}</strong> ${op.endpoint}
                            </div>
                            <div class="operation-detail">
                                ${op.summary || 'No description'}
                            </div>
                            <div class="operation-detail">
                                Input: ${op.input_attributes_count} attrs | 
                                Output: ${op.output_attributes_count} attrs
                            </div>
                        </div>
                    `;
                });
                
                html += `</div></div>`;
            }
            
            results.className = 'results visible success';
            resultsTitle.textContent = '✅ Swagger Parsed Successfully!';
            resultsContent.innerHTML = html;
        }
    </script>
</body>
</html>
