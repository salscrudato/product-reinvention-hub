<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Product Reinvention Hub">
  <!-- Favicon: the transparent Greater Ascent mark (a greater-than climbing to a crescent
       moon). Bold chevron keeps the silhouette legible down to 16px on light or dark tab
       strips. Brand-asset file: carries the canonical violet gradient as literal hex. -->
  <defs>
    <linearGradient id="fv-v" x1="4" y1="6" x2="26" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A100FF"/><stop offset=".55" stop-color="#8B1FE0"/><stop offset="1" stop-color="#7A00E6"/>
    </linearGradient>
  </defs>
  <path d="M21.4 6.44A3.15 3.15 0 1 0 25.83 10.21A3 3 0 0 1 21.4 6.44Z" fill="url(#fv-v)"/>
  <path d="M5.69 13.94L17.6 15.4L10.05 24.73" fill="none" stroke="url(#fv-v)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
