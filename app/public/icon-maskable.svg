<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512">
  <defs>
    <linearGradient id="prh-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A100FF"/><stop offset="0.5" stop-color="#8B1FE0"/><stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="prh-sheen" x1="6" y1="4" x2="24" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity="0.18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="prh-core" cx="0.5" cy="0.42" r="0.6">
      <stop offset="55%" stop-color="#fff"/><stop offset="100%" stop-color="#fff" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="prh-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.55"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Full-bleed gradient (no rounding) — the launcher applies its own mask. Mark
       scaled to 0.8 so it sits inside the maskable safe zone. -->
  <rect width="32" height="32" fill="url(#prh-bg)"/>
  <rect width="32" height="32" fill="url(#prh-sheen)"/>
  <g transform="translate(16 16) scale(0.8)">
    <g transform="rotate(-24)">
      <ellipse rx="10.6" ry="5.5" fill="none" stroke="#fff" stroke-opacity="0.9" stroke-width="2.1"/>
      <circle cx="6.1" cy="-4.5" r="2.25" fill="#fff"/>
    </g>
    <circle r="6.3" fill="url(#prh-glow)"/>
    <circle r="3.3" fill="url(#prh-core)"/>
  </g>
</svg>
