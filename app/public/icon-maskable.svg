<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512" role="img" aria-label="Product Reinvention Hub">
  <!-- Maskable icon: full-bleed deep field (the launcher applies its own mask shape); the
       mark is scaled to 0.82 about the centre so it sits inside the 80% safe zone under any mask.
       Brand-asset file: carries the canonical violet gradient as literal hex. -->
  <defs>
    <linearGradient id="mk-bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#170C30"/><stop offset="1" stop-color="#090514"/>
    </linearGradient>
    <radialGradient id="mk-glow" cx="16" cy="14" r="14" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A100FF" stop-opacity="0.32"/><stop offset="1" stop-color="#A100FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mk-fg" x1="4" y1="6" x2="26" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B65CFF"/><stop offset=".5" stop-color="#A100FF"/><stop offset="1" stop-color="#7A00E6"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" fill="url(#mk-bg)"/>
  <circle cx="16" cy="14" r="14" fill="url(#mk-glow)"/>
  <g transform="translate(16 16) scale(0.82) translate(-16 -15.5)">
    <path d="M21.4 6.44A3.15 3.15 0 1 0 25.83 10.21A3 3 0 0 1 21.4 6.44Z" fill="#E9C6FF"/>
    <path d="M5.69 13.94L17.6 15.4L10.05 24.73" fill="none" stroke="url(#mk-fg)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
