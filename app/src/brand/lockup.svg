<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" role="img" aria-labelledby="lk-t">
  <title id="lk-t">Product Factory</title>
  <!-- Horizontal lockup: transparent Greater Ascent mark + wordmark. Wordmark uses the app
       UI font stack (system SF / Inter) and the two-tone gradient-text motif.
       NOTE: the running app currently displays the name "Product Reinvention Hub"; this
       lockup spells the product name "Product Factory" (repo alias @pf/…), per brief. -->
  <defs>
    <linearGradient id="lk-word" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A100FF"/><stop offset="1" stop-color="#7A00E6"/>
    </linearGradient>
    <linearGradient id="lk-mark" x1="4" y1="6" x2="26" y2="28" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A100FF"/><stop offset=".55" stop-color="#8B1FE0"/><stop offset="1" stop-color="#7A00E6"/>
    </linearGradient>
  </defs>
  <!-- Mark: 32-unit glyph scaled 1.34, vertically centred. -->
  <g transform="translate(8.6 9.5) scale(1.34)">
    <path d="M21.4 6.44A3.15 3.15 0 1 0 25.83 10.21A3 3 0 0 1 21.4 6.44Z" fill="url(#lk-mark)"/>
    <path d="M5.69 13.94L17.6 15.4L10.05 24.73" fill="none" stroke="url(#lk-mark)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Wordmark -->
  <text x="62" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif"
        font-size="27" font-weight="640" letter-spacing="-0.7">
    <tspan fill="#131318">Product </tspan><tspan fill="url(#lk-word)">Factory</tspan>
  </text>
</svg>
