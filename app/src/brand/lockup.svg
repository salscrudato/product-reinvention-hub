<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" role="img" aria-labelledby="lk-t">
  <title id="lk-t">Product Factory</title>
  <!-- Horizontal lockup: transparent Composed Stack mark + wordmark. Wordmark uses the app
       UI font stack (system SF / Inter) and the two-tone gradient-text motif.
       NOTE: the running app currently displays the name "Product Reinvention Hub"; this
       lockup spells the product name "Product Factory" (repo alias @pf/…), per brief. -->
  <defs>
    <linearGradient id="lk-word" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A100FF"/><stop offset="1" stop-color="#7A00E6"/>
    </linearGradient>
  </defs>
  <!-- Mark: 32-unit glyph scaled 1.4, vertically centred (glyph centre → y 30). -->
  <g transform="translate(8.6 8.6) scale(1.34)">
    <path d="M17.27 5.78 21.73 7.82Q23 8.4 21.73 8.98L17.27 11.02Q16 11.6 14.73 11.02L10.27 8.98Q9 8.4 10.27 7.82L14.73 5.78Q16 5.2 17.27 5.78Z" fill="#A100FF"/>
    <path d="M17.27 13.38 21.73 15.42Q23 16 21.73 16.58L17.27 18.62Q16 19.2 14.73 18.62L10.27 16.58Q9 16 10.27 15.42L14.73 13.38Q16 12.8 17.27 13.38Z" fill="#8B1FE0"/>
    <path d="M17.27 20.98 21.73 23.02Q23 23.6 21.73 24.18L17.27 26.22Q16 26.8 14.73 26.22L10.27 24.18Q9 23.6 10.27 23.02L14.73 20.98Q16 20.4 17.27 20.98Z" fill="#7A00E6"/>
  </g>
  <!-- Wordmark -->
  <text x="62" y="38" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif"
        font-size="27" font-weight="640" letter-spacing="-0.7">
    <tspan fill="#131318">Product </tspan><tspan fill="url(#lk-word)">Factory</tspan>
  </text>
</svg>
