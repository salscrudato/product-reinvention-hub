<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 900" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowv" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8B1FE0"/>
    </marker>
    <style>
      .title{font-size:26px;font-weight:700;fill:#0f172a}
      .sub{font-size:13px;fill:#64748b}
      .zone{font-size:13px;font-weight:700;letter-spacing:.06em}
      .box{fill:#ffffff;stroke:#cbd5e1;stroke-width:1.5;rx:8}
      .lbl{font-size:13px;font-weight:600;fill:#0f172a}
      .desc{font-size:11px;fill:#64748b}
      .pill{font-size:10.5px;font-weight:600;fill:#475569}
      .edge{stroke:#64748b;stroke-width:1.6;fill:none}
      .edgev{stroke:#8B1FE0;stroke-width:2;fill:none}
      .edgelbl{font-size:11px;fill:#475569;font-weight:600}
    </style>
  </defs>

  <rect width="1240" height="900" fill="#f8fafc"/>
  <text x="40" y="46" class="title">Product Reinvention Hub — System Architecture</text>
  <text x="40" y="68" class="sub">Insurance product-management SaaS · pnpm monorepo · Azure App Service (single instance, RISK-005) · same-origin /api/* only</text>

  <!-- BROWSER ZONE -->
  <rect x="40" y="92" width="360" height="770" rx="14" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="60" y="118" class="zone" fill="#4338ca">BROWSER  (app/ · React 19 + Vite 8 SPA)</text>
  <text x="60" y="137" class="desc">Holds NO Cosmos / AI / Blob credential. Talks only to same-origin /api/*.</text>

  <rect x="60" y="152" width="320" height="86" class="box"/>
  <text x="74" y="174" class="lbl">Routes / Screens (React.lazy)</text>
  <text x="74" y="193" class="desc">Landing · Home cockpit · Products + 6 workspace tabs</text>
  <text x="74" y="209" class="desc">Builder · Explorer · Tasks · News · Claims · Dictionary</text>
  <text x="74" y="225" class="desc">Feedback · Admin · Tenant-Admin · HomeCheck (guest)</text>

  <rect x="60" y="250" width="320" height="78" class="box"/>
  <text x="74" y="272" class="lbl">State: React Context + hooks</text>
  <text x="74" y="291" class="desc">No Redux/Zustand. UserContext · ProductContext</text>
  <text x="74" y="307" class="desc">(10 live subscriptions per product workspace)</text>
  <text x="74" y="323" class="desc">CaptureContext · FeedbackLaunchContext</text>

  <rect x="60" y="340" width="320" height="128" class="box" stroke="#8B1FE0" stroke-width="2"/>
  <text x="74" y="362" class="lbl" fill="#8B1FE0">BackendAdapter seam  (app/src/lib/backend/)</text>
  <text x="74" y="381" class="desc">azure.adapter.ts — the ONLY impl. No SDK in components.</text>
  <text x="74" y="399" class="desc">db · auth · storage · fns · presence · tenancy · orgAdmin</text>
  <text x="74" y="417" class="desc">db.mutate → POST /api/db/mutate  (409 → conflict)</text>
  <text x="74" y="435" class="desc">subscribe = SMART POLLING (no push): backoff 3.5→30s,</text>
  <text x="74" y="452" class="desc">tab-hidden pause, dedupe, stale-while-revalidate</text>

  <rect x="60" y="480" width="320" height="66" class="box"/>
  <text x="74" y="502" class="lbl">Client auth &amp; caps (non-authoritative)</text>
  <text x="74" y="521" class="desc">JWT in localStorage 'pf.azure.token' → Bearer</text>
  <text x="74" y="537" class="desc">lib/canI.ts mirrors server authz; UI gating only</text>

  <rect x="60" y="558" width="320" height="72" class="box"/>
  <text x="74" y="580" class="lbl">Design system + PWA</text>
  <text x="74" y="599" class="desc">Tailwind v4 @theme tokens · dark [data-theme] · reduced-motion</text>
  <text x="74" y="615" class="desc">sw.js: assets cache-first, HTML network-first, /api pass-through</text>

  <rect x="60" y="642" width="320" height="60" class="box"/>
  <text x="74" y="664" class="lbl">Tests</text>
  <text x="74" y="683" class="desc">vitest · vitest-axe (WCAG AA) · __invariants__ (no-bare-writes)</text>

  <text x="60" y="742" class="desc" font-weight="700" fill="#4338ca">Guest surface (no auth):</text>
  <rect x="60" y="752" width="320" height="46" class="box" stroke="#0891b2"/>
  <text x="74" y="774" class="lbl" fill="#0e7490">/home-check — consumer home-risk check</text>
  <text x="74" y="790" class="desc">Zero portfolio access · AI via /api/homecheck/v1</text>

  <!-- SERVER ZONE -->
  <rect x="430" y="92" width="430" height="770" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="450" y="118" class="zone" fill="#15803d">AZURE APP SERVICE  (server/ · Express host)</text>
  <text x="450" y="137" class="desc">server.js serves built SPA + /api/*. Fail-closed if AUTH_JWT_SECRET unset.</text>

  <rect x="450" y="152" width="390" height="92" class="box"/>
  <text x="464" y="174" class="lbl">Middleware chain (defense-in-depth)</text>
  <text x="464" y="193" class="desc">compression (SSE-bypass) → json 25mb → attachUser</text>
  <text x="464" y="209" class="desc">→ global auth gate: PUBLIC_API allowlist; else 401;</text>
  <text x="464" y="225" class="desc">break-glass deny → 403; writes need product:write cap</text>
  <text x="464" y="239" class="pill">Per-IP token-bucket rate limits (login 10/hr · tenants 60/hr)</text>

  <rect x="450" y="258" width="188" height="120" class="box"/>
  <text x="464" y="280" class="lbl">auth.js</text>
  <text x="464" y="298" class="desc">Hand-rolled HS256 JWT</text>
  <text x="464" y="313" class="desc">(jti revoke, 8h TTL)</text>
  <text x="464" y="328" class="desc">OTP (HMAC, lockout)</text>
  <text x="464" y="343" class="desc">+ bootstrap admin</text>
  <text x="464" y="358" class="desc">2-plane roles; break-</text>
  <text x="464" y="372" class="desc">glass; impersonation</text>

  <rect x="652" y="258" width="188" height="120" class="box" stroke="#8B1FE0" stroke-width="2"/>
  <text x="666" y="280" class="lbl" fill="#8B1FE0">data.js</text>
  <text x="666" y="298" class="desc">Atomic mutate envelope:</text>
  <text x="666" y="313" class="desc">1 Cosmos txn batch =</text>
  <text x="666" y="328" class="desc">entity + audit(hash-</text>
  <text x="666" y="343" class="desc">chained) + version +</text>
  <text x="666" y="358" class="desc">searchIndex + chainHead</text>
  <text x="666" y="372" class="desc">+ groundingChunk</text>

  <rect x="450" y="392" width="390" height="118" class="box"/>
  <text x="464" y="414" class="lbl">AI routers (/api/ai/*) — SSE streaming</text>
  <text x="464" y="433" class="desc">chat (portfolio copilot, RAG+cite) · analyzeClaim ·</text>
  <text x="464" y="449" class="desc">summarizeProduct · unifiedImport (import brain) ·</text>
  <text x="464" y="465" class="desc">scaffoldProduct · draftRule · proposeMapping ·</text>
  <text x="464" y="481" class="desc">identifyBaseForm · reindexProduct · refreshNews</text>
  <text x="464" y="500" class="pill">fleet.js: role→model routing + in-process cost guard ($25/1h)</text>

  <rect x="450" y="524" width="390" height="86" class="box"/>
  <text x="464" y="546" class="lbl">Other routers</text>
  <text x="464" y="565" class="desc">/api/admin (platform) · /api/tenant-admin (org self-serve)</text>
  <text x="464" y="581" class="desc">/api/serff/v1 (filing bundle) · /api/filing (freeze) ·</text>
  <text x="464" y="597" class="desc">/api/storage (blob) · /api/homecheck/v1 (guest)</text>

  <rect x="450" y="624" width="390" height="76" class="box"/>
  <text x="464" y="646" class="lbl">Bundled engine  (server/lib/*-shared.cjs)</text>
  <text x="464" y="665" class="desc">esbuild-bundled from shared/src at build time:</text>
  <text x="464" y="681" class="desc">fleet · audit-chain · chunk · retrieve · import-brain · serff · filing · seed</text>

  <rect x="450" y="714" width="390" height="80" class="box" stroke="#f59e0b"/>
  <text x="464" y="736" class="lbl" fill="#b45309">RISK-005 — single instance required</text>
  <text x="464" y="755" class="desc">In-memory: cost guard · rate limiters · JWT revocation</text>
  <text x="464" y="771" class="desc">cache · HomeCheck sessions. Do NOT scale out without</text>
  <text x="464" y="787" class="desc">a shared/distributed store.</text>

  <!-- EXTERNAL ZONE -->
  <rect x="890" y="92" width="310" height="770" rx="14" fill="#fefce8" stroke="#fde68a" stroke-width="1.5"/>
  <text x="910" y="118" class="zone" fill="#a16207">AZURE MANAGED SERVICES</text>
  <text x="910" y="137" class="desc">Secrets in App Service config (env), server-side only.</text>

  <rect x="910" y="156" width="270" height="150" class="box"/>
  <text x="924" y="178" class="lbl">Cosmos DB</text>
  <text x="924" y="197" class="desc">Containers: docs · presence</text>
  <text x="924" y="213" class="desc">Partition key:</text>
  <text x="924" y="229" class="desc">${tenantId}|${baseKey(path)}</text>
  <text x="924" y="248" class="desc">Every query filters c.tenantId</text>
  <text x="924" y="264" class="desc">(tenant isolation).</text>
  <text x="924" y="283" class="desc">Transactional batch = the</text>
  <text x="924" y="299" class="desc">atomic mutate primitive.</text>

  <rect x="910" y="320" width="270" height="200" class="box"/>
  <text x="924" y="342" class="lbl">Azure AI Foundry</text>
  <text x="924" y="360" class="desc">project foundry-prodhub-dev</text>
  <text x="924" y="380" class="pill">Anthropic surface (/anthropic):</text>
  <text x="924" y="396" class="desc">opus-4-8 (GROUNDED_CITED)</text>
  <text x="924" y="412" class="desc">sonnet-5 (MID_REASONER)</text>
  <text x="924" y="428" class="desc">haiku-4-5 (BULK_VERIFY)</text>
  <text x="924" y="448" class="pill">OpenAI surface (/openai/v1):</text>
  <text x="924" y="464" class="desc">gpt-5.1 (VISION/validator)</text>
  <text x="924" y="480" class="desc">gpt-5-mini (CHEAP_GENERAL)</text>
  <text x="924" y="496" class="desc">text-embedding-3-small (EMBED)</text>
  <text x="924" y="513" class="desc">int8-quantized chunk vectors</text>

  <rect x="910" y="534" width="270" height="70" class="box"/>
  <text x="924" y="556" class="lbl">Azure Blob Storage</text>
  <text x="924" y="575" class="desc">Uploads (base64→blob, EDITOR+)</text>
  <text x="924" y="591" class="desc">Frozen filing packages (write-once)</text>

  <rect x="910" y="622" width="270" height="90" class="box"/>
  <text x="924" y="644" class="lbl">CI/CD — Azure DevOps</text>
  <text x="924" y="663" class="desc">push main → gitleaks scan →</text>
  <text x="924" y="679" class="desc">typecheck → RATING CANARIES →</text>
  <text x="924" y="695" class="desc">build → bundle-budget → deploy</text>

  <rect x="910" y="730" width="270" height="64" class="box"/>
  <text x="924" y="752" class="lbl">Email (OTP delivery)</text>
  <text x="924" y="771" class="desc">SMTP / Azure Comm Services</text>
  <text x="924" y="787" class="desc">Codes never logged</text>

  <!-- EDGES browser->server -->
  <path class="edgev" d="M380,406 C405,406 410,320 448,300" marker-end="url(#arrowv)"/>
  <text x="386" y="336" class="edgelbl" fill="#8B1FE0">/api/*</text>
  <path class="edgev" d="M380,406 C408,406 418,440 448,448" marker-end="url(#arrowv)"/>
  <text x="386" y="470" class="edgelbl" fill="#8B1FE0">HTTPS + Bearer JWT</text>

  <!-- server -> services -->
  <path class="edge" d="M842,318 C875,318 878,250 908,232" marker-end="url(#arrow)"/>
  <text x="846" y="270" class="edgelbl">Cosmos SDK</text>
  <path class="edge" d="M842,451 C872,451 880,430 908,420" marker-end="url(#arrow)"/>
  <text x="846" y="445" class="edgelbl">Foundry key</text>
  <path class="edge" d="M842,565 C872,565 880,568 908,568" marker-end="url(#arrow)"/>
  <text x="846" y="558" class="edgelbl">Blob conn</text>
</svg>
