<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/></marker>
    <marker id="av" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#8B1FE0"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/></marker>
    <style>
      .title{font-size:25px;font-weight:700;fill:#0f172a}
      .sub{font-size:13px;fill:#64748b}
      .lbl{font-size:13.5px;font-weight:700;fill:#0f172a}
      .desc{font-size:11.5px;fill:#475569}
      .mono{font-family:'JetBrains Mono',Consolas,monospace;font-size:11px;fill:#334155}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
      .op{fill:#f5f3ff;stroke:#8B1FE0;stroke-width:1.5}
      .edge{stroke:#64748b;stroke-width:1.6;fill:none}
    </style>
  </defs>
  <rect width="1240" height="860" fill="#f8fafc"/>
  <text x="40" y="46" class="title">Atomic Mutate Envelope + Tamper-Evident Audit Hash-Chain</text>
  <text x="40" y="68" class="sub">Every entity write is ONE Cosmos transactional batch (all-or-nothing) · server/lib/data.js · shared/src/audit/chain.ts</text>

  <!-- client -->
  <rect x="40" y="96" width="250" height="150" rx="10" class="box" stroke="#8B1FE0" stroke-width="2"/>
  <text x="56" y="120" class="lbl" fill="#8B1FE0">Client</text>
  <text x="56" y="142" class="desc">adapter.db.mutate(payload)</text>
  <text x="56" y="162" class="mono">{ op:'update', path,</text>
  <text x="56" y="178" class="mono">  data, entityType,</text>
  <text x="56" y="194" class="mono">  productId?, actor,</text>
  <text x="56" y="210" class="mono">  expectedRev? }</text>
  <text x="56" y="232" class="desc">POST /api/db/mutate</text>

  <!-- gate -->
  <rect x="330" y="96" width="250" height="150" rx="10" class="box"/>
  <text x="346" y="120" class="lbl">Server gate (data.js)</text>
  <text x="346" y="142" class="desc">• requireCapability('product:write')</text>
  <text x="346" y="160" class="desc">• requireTenant (JWT tenantId)</text>
  <text x="346" y="178" class="desc">• strip RESERVED keys from data</text>
  <text x="346" y="196" class="desc">  (tenantId/pk/kind/coll/path)</text>
  <text x="346" y="214" class="desc">• actor derived from JWT, never</text>
  <text x="346" y="230" class="desc">  trusted from client</text>

  <!-- envelope build -->
  <rect x="620" y="96" width="290" height="150" rx="10" class="box"/>
  <text x="636" y="120" class="lbl">envelope() builds ops</text>
  <text x="636" y="142" class="desc">pk = ${tenantId}|${baseKey(path)}</text>
  <text x="636" y="160" class="desc">All ops share ONE partition →</text>
  <text x="636" y="176" class="desc">eligible for a transactional batch.</text>
  <text x="636" y="196" class="desc">expectedRev mismatch → 409 conflict</text>
  <text x="636" y="214" class="desc">parentId must resolve (same tenant)</text>
  <text x="636" y="230" class="desc">→ else 422 invalid_parent</text>

  <path class="edge" d="M290,171 L326,171" marker-end="url(#a)"/>
  <path class="edge" d="M580,171 L616,171" marker-end="url(#a)"/>

  <!-- the batch -->
  <rect x="40" y="286" width="870" height="330" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="60" y="312" class="lbl" fill="#15803d">store.items.batch(ops, pk)  —  ONE atomic Cosmos transactional batch (all commit or all roll back)</text>

  <rect x="60" y="330" width="255" height="86" rx="8" class="op"/>
  <text x="74" y="352" class="lbl">1 · entity  (Upsert / Delete)</text>
  <text x="74" y="372" class="desc">The row itself. op:update = shallow</text>
  <text x="74" y="388" class="desc">merge onto existing data.</text>
  <text x="74" y="404" class="desc">Server is sole writer of tenantId.</text>

  <rect x="330" y="330" width="255" height="86" rx="8" class="op" stroke="#dc2626"/>
  <text x="344" y="352" class="lbl" fill="#b91c1c">2 · audit  (Create — append-only)</text>
  <text x="344" y="372" class="desc">hash, prevHash, diff(before/changed).</text>
  <text x="344" y="388" class="desc">NEVER upserted → immutable trail.</text>
  <text x="344" y="404" class="desc">See hash construction below.</text>

  <rect x="600" y="330" width="290" height="86" rx="8" class="op"/>
  <text x="614" y="352" class="lbl">3 · version  (Upsert)</text>
  <text x="614" y="372" class="desc">rev bump + diff snapshot.</text>
  <text x="614" y="388" class="desc">Powers HistoryDrawer / rollback</text>
  <text x="614" y="404" class="desc">and optimistic-concurrency rev.</text>

  <rect x="60" y="430" width="255" height="82" rx="8" class="op"/>
  <text x="74" y="452" class="lbl">4 · searchIndex  (Upsert)</text>
  <text x="74" y="472" class="desc">searchText from string values</text>
  <text x="74" y="488" class="desc">(4000-char cap). Powers ⌘K.</text>

  <rect x="330" y="430" width="255" height="82" rx="8" class="op" stroke="#dc2626"/>
  <text x="344" y="452" class="lbl" fill="#b91c1c">5 · chainHead  (Upsert, etag-guarded)</text>
  <text x="344" y="472" class="desc">Per-path anchor = latest prevHash.</text>
  <text x="344" y="488" class="desc">_etag rides batch as ifMatchETag.</text>

  <rect x="600" y="430" width="290" height="82" rx="8" class="op"/>
  <text x="614" y="452" class="lbl">6 · groundingChunk  (Upsert)</text>
  <text x="614" y="472" class="desc">RAG chunk + int8 embedding</text>
  <text x="614" y="488" class="desc">(best-effort). Same pk → atomic.</text>

  <rect x="60" y="528" width="830" height="72" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="74" y="550" class="lbl" fill="#b91c1c">Concurrent-writer guard (lost-update / fork prevention)</text>
  <text x="74" y="570" class="desc">chainHead._etag mismatch → batch fails with 412 Precondition Failed. commitEnvelope re-reads fresh state and</text>
  <text x="74" y="586" class="desc">rebuilds the batch (up to 3 attempts). Two writers on the same path can never both extend the chain.</text>

  <!-- hash construction -->
  <rect x="950" y="286" width="250" height="330" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="966" y="312" class="lbl" fill="#1d4ed8">Hash construction</text>
  <text x="966" y="334" class="desc">computeAuditHash =</text>
  <text x="966" y="350" class="desc">SHA-256 over canonicalized:</text>
  <text x="966" y="372" class="mono">tenantId</text>
  <text x="966" y="388" class="mono">entityPath</text>
  <text x="966" y="404" class="mono">entityType</text>
  <text x="966" y="420" class="mono">op</text>
  <text x="966" y="436" class="mono">actor</text>
  <text x="966" y="452" class="mono">rev</text>
  <text x="966" y="468" class="mono">at</text>
  <text x="966" y="484" class="mono">source</text>
  <text x="966" y="500" class="mono">diff</text>
  <text x="966" y="516" class="mono">prevHash  ← links to prior</text>
  <text x="966" y="546" class="desc">Self-contained SHA-256 in</text>
  <text x="966" y="562" class="desc">the bundle (no crypto dep</text>
  <text x="966" y="578" class="desc">variance across environments).</text>
  <text x="966" y="600" class="desc">prevHash chaining = each event</text>

  <!-- verify -->
  <rect x="40" y="648" width="1160" height="180" rx="12" class="box"/>
  <text x="60" y="674" class="lbl">Verification — GET /api/db/audit/verify  (verifyAuditChain, capability audit:read)</text>
  <text x="60" y="700" class="desc">Reconstructs every event hash and walks the prevHash links per ${tenantId} ${entityPath}. Detects four tamper classes:</text>

  <rect x="60" y="716" width="270" height="92" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="74" y="738" class="lbl" fill="#b91c1c">hash_mismatch</text>
  <text x="74" y="758" class="desc">A stored event was edited —</text>
  <text x="74" y="774" class="desc">recomputed hash ≠ stored hash.</text>
  <text x="74" y="792" class="desc">Any field mutation is caught.</text>

  <rect x="345" y="716" width="270" height="92" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="359" y="738" class="lbl" fill="#b91c1c">link_broken</text>
  <text x="359" y="758" class="desc">An event's prevHash does not</text>
  <text x="359" y="774" class="desc">match the hash of its predecessor</text>
  <text x="359" y="792" class="desc">(insert/delete in the middle).</text>

  <rect x="630" y="716" width="270" height="92" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="644" y="738" class="lbl" fill="#b91c1c">fork</text>
  <text x="644" y="758" class="desc">Two events claim the same</text>
  <text x="644" y="774" class="desc">prevHash — a branched chain</text>
  <text x="644" y="792" class="desc">(concurrent unetag'd write).</text>

  <rect x="915" y="716" width="270" height="92" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="929" y="738" class="lbl" fill="#b91c1c">truncation</text>
  <text x="929" y="758" class="desc">Chain tail shorter than the</text>
  <text x="929" y="774" class="desc">chainHead anchor expects —</text>
  <text x="929" y="792" class="desc">trailing events were dropped.</text>

  <path class="edge" d="M475,616 L475,644" marker-end="url(#a)"/>
</svg>
